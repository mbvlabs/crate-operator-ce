openapi: 3.0.0
info:
  title: Crate Operator Community Edition API
  version: 0.1.0
  license:
    name: O'Sassy
    url: https://osaasy.dev/
  description: |
    Server operator API for handling deployments, updates, and health checks.
    This agent is installed on servers/VPS instances and communicates with the DeployCrate platform.

servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authenticating requests from the DeployCrate platform

  schemas:
    AppActionRequest:
      type: object
      required:
        - app_slug
        - environment
      properties:
        app_slug:
          type: string
        environment:
          type: string
    AppActionResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        output:
          type: string

    CreateBinaryAppRequest:
      type: object
      required:
        - app_id
        - app_slug
        - deployment_id
        - team_slug
        - environment_name
        - artifact_source
        - artifact_name
        - artifact_version
        - callback_url
        - domain
        - port
      properties:
        app_id:
          type: string
        app_slug:
          type: string
        deployment_id:
          type: string
        team_slug:
          type: string
        environment_name:
          type: string
        artifact_source:
          type: string
        artifact_version:
          type: string
        artifact_name:
          type: string
        callback_url:
          type: string
          format: uri
        domain:
          type: string
        env_vars:
          type: object
          additionalProperties:
            type: string
        port:
          type: integer
        healthcheck_url:
          type: string

    DeployBinaryAppRequest:
      type: object
      required:
        - app_id
        - app_slug
        - deployment_id
        - team_slug
        - environment_name
        - artifact_source
        - artifact_name
        - artifact_version
        - callback_url
      properties:
        app_id:
          type: string
        app_slug:
          type: string
        deployment_id:
          type: string
        team_slug:
          type: string
        environment_name:
          type: string
        artifact_source:
          type: string
        artifact_version:
          type: string
        artifact_name:
          type: string
        callback_url:
          type: string
          format: uri
        env_vars:
          type: object
          additionalProperties:
            type: string
        args:
          type: array
          items:
            type: string

    CreateDockerAppRequest:
      type: object
      required:
        - app_id
        - app_slug
        - deployment_id
        - team_slug
        - environment_name
        - artifact_source
        - artifact_version
        - callback_url
        - domain
        - port
      properties:
        app_id:
          type: string
        app_slug:
          type: string
        deployment_id:
          type: string
        team_slug:
          type: string
        environment_name:
          type: string
        artifact_source:
          type: string
          description: Docker image reference without the tag (e.g. `registry.example.com/myapp`).
        artifact_version:
          type: string
          description: Docker image tag (e.g. `v1.2.3`).
        callback_url:
          type: string
          format: uri
        domain:
          type: string
        env_vars:
          type: object
          additionalProperties:
            type: string
        port:
          type: integer
        docker_command:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: string
        volumes:
          type: array
          items:
            type: string

    DeployDockerAppRequest:
      type: object
      required:
        - app_id
        - app_slug
        - deployment_id
        - team_slug
        - environment_name
        - artifact_source
        - artifact_version
        - callback_url
      properties:
        app_id:
          type: string
        app_slug:
          type: string
        deployment_id:
          type: string
        team_slug:
          type: string
        environment_name:
          type: string
        artifact_source:
          type: string
          description: Docker image reference without the tag (e.g. `registry.example.com/myapp`).
        artifact_version:
          type: string
          description: Docker image tag (e.g. `v1.2.3`).
        callback_url:
          type: string
          format: uri
        env_vars:
          type: object
          additionalProperties:
            type: string

    UpdateAgentRequest:
      type: object
      required:
        - artifact_version
      properties:
        artifact_version:
          type: string
        override_artifact_source:
          type: string
    UpdateAgentResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string

    DeployResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
        logs:
          type: string

    GenericObject:
      type: object
      additionalProperties: true

    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum: [healthy]
          example: healthy
        version:
          type: string
          example: "0.1.0"

    LogEntry:
      type: object
      required:
        - timestamp
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the log entry.
        message:
          type: string
          description: The log message content.
        priority:
          type: string
          enum: [emerg, alert, crit, err, warning, notice, info, debug]
          description: Syslog severity level.

    LogsResponse:
      type: object
      required:
        - service
        - entries
      properties:
        service:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LogEntry"

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns the health status and version of the agent.
      tags:
        - Health
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Agent is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAgentResponse"

  /agent/update:
    post:
      operationId: updateAgent
      summary: Update agent binary
      tags:
        - Agent
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "202":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAgentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAgentResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAgentResponse"

  /app/create/binary:
    post:
      operationId: createBinaryApp
      summary: Create binary app (install and start)
      tags:
        - App
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBinaryAppRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"

  /app/create/docker:
    post:
      operationId: createDockerApp
      summary: Create docker app (install and start)
      tags:
        - App
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDockerAppRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"

  /app/deploy/binary:
    post:
      operationId: deployBinaryApp
      summary: Deploy binary app (update and restart)
      tags:
        - App
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployBinaryAppRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"

  /app/deploy/docker:
    post:
      operationId: deployDockerApp
      summary: Deploy docker app (update and restart)
      tags:
        - App
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployDockerAppRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployResponse"

  /app/start:
    post:
      operationId: startApp
      summary: Start app service
      tags:
        - App
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppActionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"

  /app/stop:
    post:
      operationId: stopApp
      summary: Stop app service
      tags:
        - App
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppActionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"

  /v1/app/logs:
    get:
      operationId: getAppLogs
      summary: Get logs for a specific app environment
      description: >
        Returns systemd journal logs for the service belonging to a specific
        app environment. The lookback window is capped at 3 hours.
      tags:
        - Logs
      security:
        - ApiKeyAuth: []
      parameters:
        - name: team_slug
          in: query
          required: true
          schema:
            type: string
        - name: app_id
          in: query
          required: true
          schema:
            type: string
        - name: app_slug
          in: query
          required: true
          schema:
            type: string
        - name: environment_name
          in: query
          required: true
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: string
            default: "5m"
            enum:
              - "1m"
              - "5m"
              - "15m"
              - "30m"
              - "1h"
              - "3h"
          description: >-
            How far back to fetch logs. Capped at 3 hours.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"

  /v1/logs:
    get:
      operationId: getServiceLogs
      summary: Get systemd journal logs for a server-level service
      description: >
        Returns systemd journal logs for an allow-listed system service.
        The lookback window is capped at 3 hours.
      tags:
        - Logs
      security:
        - ApiKeyAuth: []
      parameters:
        - name: service
          in: query
          required: true
          schema:
            type: string
            enum:
              - mithlond-agent
              - caddy
              - docker
              - fail2ban
              - node_exporter
              - ssh
          description: The systemd service unit to fetch logs for.
        - name: since
          in: query
          required: false
          schema:
            type: string
            default: "5m"
            enum:
              - "1m"
              - "5m"
              - "15m"
              - "30m"
              - "1h"
              - "3h"
          description: >-
            How far back to fetch logs. Capped at 3 hours.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "400":
          description: Bad Request — invalid or disallowed service name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"

  /app/restart:
    post:
      operationId: restartApp
      summary: Restart app service
      tags:
        - App
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppActionRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"
        "500":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppActionResponse"
